<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ACWAverse</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
/* ACWAverse
   Layout: one working screen. Tools on the left, the process diagram in the
   middle, details on the right, time and trends along the bottom.
   The look borrows from engineering drawings and plant control screens:
   quiet neutral surfaces, ink line work, water in blue, instrument signals in
   violet dashes, and red kept for alarms and attacks. */

:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --surface-2: #f6f8fa;
  --canvas: #fbfcfd;
  --grid: #d3dbe2;
  --line: #d6dde4;
  --ink: #17212b;
  --ink-2: #485866;
  --ink-3: #7c8b99;
  --pipe: #6b7a88;
  --water: #2a78d6;
  --water-strong: #1c5cab;
  --water-fill: #9ec5f4;
  --on-water: #ffffff;
  --signal: #6250d6;
  --signal-soft: #edeafc;
  --accent: #0b6bcb;
  --accent-soft: rgba(11, 107, 203, 0.12);
  --on-accent: #ffffff;
  --alarm: #c93434;
  --alarm-soft: #fbe6e4;
  --warn: #9a6400;
  --warn-soft: #fbf0d6;
  --ok: #0a7d32;
  --seq-lo: #cde2fb;
  --seq-hi: #0d366b;
  --cyber: #6250d6;
  --physical: #c06a1a;
  --chemical: #128a63;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --shadow: 0 1px 2px rgba(23, 33, 43, 0.08), 0 4px 14px rgba(23, 33, 43, 0.06);

  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e141a; --surface: #172029; --surface-2: #1d2832; --canvas: #121a22; --grid: #25323f; --line: #2b3946;
    --ink: #e7edf2; --ink-2: #aab8c5; --ink-3: #74859a; --pipe: #8494a4;
    --water: #3987e5; --water-strong: #86b6ef; --water-fill: #1c5cab; --on-water: #ffffff;
    --signal: #9085e9; --signal-soft: #26244a; --accent: #5aa2f0; --accent-soft: rgba(90, 162, 240, 0.16); --on-accent: #0b1620;
    --alarm: #f07070; --alarm-soft: #3c1d20; --warn: #e3ac3c; --warn-soft: #3a2e12; --ok: #4cc26c;
    --seq-lo: #173556; --seq-hi: #b7d3f6; --cyber: #9085e9; --physical: #e0934a; --chemical: #35b98c;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 18px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e141a; --surface: #172029; --surface-2: #1d2832; --canvas: #121a22; --grid: #25323f; --line: #2b3946;
  --ink: #e7edf2; --ink-2: #aab8c5; --ink-3: #74859a; --pipe: #8494a4;
  --water: #3987e5; --water-strong: #86b6ef; --water-fill: #1c5cab; --on-water: #ffffff;
  --signal: #9085e9; --signal-soft: #26244a; --accent: #5aa2f0; --accent-soft: rgba(90, 162, 240, 0.16); --on-accent: #0b1620;
  --alarm: #f07070; --alarm-soft: #3c1d20; --warn: #e3ac3c; --warn-soft: #3a2e12; --ok: #4cc26c;
  --seq-lo: #173556; --seq-hi: #b7d3f6; --cyber: #9085e9; --physical: #e0934a; --chemical: #35b98c;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 18px rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 14px/1.45 var(--font);
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ---------------------------------------------------------------- shell */

#app {
  height: 100%;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) 348px;
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "top top top" "rail stage side" "dock dock side";
}

.topbar {
  grid-area: top;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 18px;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand strong { font: 600 19px/1 var(--font-display); letter-spacing: 0.01em; }
.brand span { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 30ch; }
.bar-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.bar-group.end { margin-left: auto; }
.view-options label { color: var(--ink-2); font-size: 13px; }
.toggle { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }

.btn, select, input[type="number"], input[type="text"], textarea {
  border: 1px solid var(--line);
  border-radius: 5px;
  background: var(--surface);
  padding: 5px 10px;
  min-height: 30px;
}
.btn { cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--ink-3); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.small { padding: 3px 9px; min-height: 26px; font-size: 13px; }
.btn.danger { color: var(--alarm); }
.btn.icon-btn { padding: 0; width: 30px; display: inline-grid; place-items: center; }
.icon { display: inline-grid; }
.icon svg path { fill: currentColor; }
select { padding-right: 6px; max-width: 100%; }

.status {
  border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2);
  padding: 4px 12px 4px 26px; font-size: 13px; cursor: pointer; position: relative; color: var(--ink-2);
}
.status::before { content: ""; position: absolute; left: 10px; top: 50%; width: 8px; height: 8px; margin-top: -4px; border-radius: 50%; background: var(--ok); }
.status[data-kind="bad"] { color: var(--alarm); border-color: var(--alarm); background: var(--alarm-soft); }
.status[data-kind="bad"]::before { background: var(--alarm); border-radius: 1px; transform: rotate(45deg); }
.status[data-kind="busy"]::before { background: var(--warn); }

.rail {
  grid-area: rail;
  display: flex; flex-direction: column; gap: 4px;
  padding: 10px 8px 10px max(16px, env(safe-area-inset-left, 0px));
  background: var(--surface);
  border-right: 1px solid var(--line);
  overflow-y: auto;
}
.tool {
  display: grid; justify-items: center; gap: 2px; width: 62px; padding: 7px 2px 5px;
  border: 1px solid transparent; border-radius: 6px; background: none; cursor: pointer; color: var(--ink-2); font-size: 11px;
}
.tool svg { stroke: currentColor; stroke-width: 1.7; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.tool svg .fill { fill: currentColor; stroke: none; }
.tool svg .fill.soft { opacity: 0.35; }
.tool svg .thin { stroke-width: 1.4; }
.tool:hover { background: var(--surface-2); color: var(--ink); }
.tool.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

.stage { grid-area: stage; position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--canvas); }
.zoom { position: absolute; right: 12px; top: 12px; display: flex; gap: 4px; }
.zoom .btn { box-shadow: var(--shadow); }
.diagram-hint {
  position: absolute; left: 50%; top: 12px; transform: translateX(-50%); max-width: min(520px, calc(100% - 200px));
  background: var(--ink); color: var(--surface); padding: 6px 12px; border-radius: 5px; font-size: 13px; box-shadow: var(--shadow); pointer-events: none;
}
.diagram-legend {
  position: absolute; left: 12px; bottom: 12px; display: grid; grid-template-columns: auto 120px auto; gap: 2px 8px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 6px 10px; font-size: 12px; box-shadow: var(--shadow);
}
.diagram-legend span { grid-column: 1 / -1; color: var(--ink-2); }
.diagram-legend i { height: 8px; border-radius: 2px; background: linear-gradient(to right, var(--seq-lo), var(--seq-hi)); }
.diagram-legend b { font: 500 11px var(--font-mono); }

.side {
  grid-area: side; display: flex; flex-direction: column; min-height: 0;
  background: var(--surface); border-left: 1px solid var(--line);
}
.dock {
  grid-area: dock; min-width: 0;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 8px 14px 10px max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 8px;
}
.toast {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20;
  background: var(--ink); color: var(--surface); padding: 8px 14px; border-radius: 6px; box-shadow: var(--shadow); max-width: min(90vw, 480px);
}

/* ---------------------------------------------------------------- diagram */

.diagram { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; cursor: grab; }
.diagram[data-tool]:not([data-tool="select"]) { cursor: crosshair; }
.grid-dot { fill: var(--grid); }
.diagram text { font-family: var(--font-mono); paint-order: stroke; stroke: var(--canvas); stroke-width: 3.5px; stroke-linejoin: round; pointer-events: none; }
.diagram .name { font-size: 11px; font-weight: 600; fill: var(--ink); }
.diagram .name.small { font-size: 10px; font-weight: 500; fill: var(--ink-3); }
.diagram .value { font-size: 10.5px; font-weight: 500; fill: var(--ink-2); }
.diagram .note { font-size: 10px; font-weight: 600; fill: var(--alarm); }
.diagram .halo { fill: none; stroke: none; }
.diagram .selected > .halo, .diagram .selected .symbol > .halo { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.6; }
.diagram [data-kind] { cursor: pointer; }

.link .hit { fill: none; stroke: transparent; stroke-width: 18; }
.link .base { fill: none; stroke: var(--pipe); stroke-linecap: round; }
.link .flow { fill: none; stroke: var(--water); stroke-linecap: round; stroke-dasharray: 7 11; opacity: 0; }
.link.flowing .flow { opacity: 1; animation: march 1.4s linear infinite; }
.link.flowing.backward .flow { animation-direction: reverse; }
.link.flowing .base { stroke: var(--water-fill); }
@keyframes march { from { stroke-dashoffset: 18; } to { stroke-dashoffset: 0; } }
.link .chevron { fill: none; stroke: var(--ink-3); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.link.flowing .chevron { stroke: var(--water-strong); stroke-width: 2.4; }
.link.pipe .chevron { opacity: 0.55; }
.link.pipe.flowing .chevron { opacity: 1; }
.link.selected .base { stroke: var(--accent); }
.link[data-state="off"] .base { stroke-dasharray: 2 6; }
.link.pipe.blocked .base { stroke: var(--alarm); }

.link.pump .body { fill: var(--surface); stroke: var(--ink); stroke-width: 2; }
.link.pump .arrow { fill: var(--ink); }
.link.pump[data-state="on"] .body { fill: var(--water); stroke: var(--water-strong); }
.link.pump[data-state="on"] .arrow { fill: var(--on-water); }
.link.pump[data-state="failed"] .body { fill: var(--alarm-soft); stroke: var(--alarm); }
.link.pump[data-state="failed"] .arrow { fill: var(--alarm); opacity: 0.35; }
.link.pump .cross { fill: none; stroke: var(--alarm); stroke-width: 2.6; stroke-linecap: round; }
.link.pump.cavitating .body { stroke: var(--warn); stroke-dasharray: 3 2; }
.link.valve .body { fill: var(--surface); stroke: var(--ink); stroke-width: 1.8; stroke-linejoin: round; }
.link.valve .stem { fill: var(--surface); stroke: var(--ink); stroke-width: 1.4; }
.link.valve[data-state="off"] .body { fill: var(--ink); }
.link.valve[data-state="part"] .body { fill: var(--water-fill); }
.link.valve .direction { fill: none; stroke: var(--ink-3); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.link .check { fill: var(--surface); stroke: var(--ink); stroke-width: 1.6; stroke-linejoin: round; }
.link .shut { fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; }

.node.tank .shell { fill: var(--surface); stroke: none; }
.node.tank .water, .node.reservoir .water { fill: var(--water-fill); }
.node.tank .surface { fill: none; stroke: var(--water); stroke-width: 1.6; }
.node .wall { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.node.reservoir .water { stroke: var(--water); stroke-width: 1.4; }
.node.junction .dot { fill: var(--ink); stroke: var(--canvas); stroke-width: 1.5; }
.node .tap path { fill: none; stroke: var(--water-strong); stroke-width: 2; stroke-linecap: round; }
.node .tap .head { fill: var(--water-strong); stroke: none; }
.node .tap.short path { stroke: var(--alarm); }
.node .tap.short .head { fill: var(--alarm); }
.node .spill { fill: none; stroke: var(--water); stroke-width: 3; stroke-linecap: round; }
.node .leak path { fill: none; stroke: var(--alarm); stroke-width: 1.8; stroke-linecap: round; }
.node .leak .value { fill: var(--alarm); }
.node.alarm .wall { stroke: var(--alarm); }
.attack-badge circle { fill: var(--alarm); stroke: var(--canvas); stroke-width: 1.5; }
.attack-badge path { fill: none; stroke: #ffffff; stroke-width: 2; stroke-linecap: round; }
.attacked > .halo, .attacked .symbol > .halo { stroke: var(--alarm); stroke-width: 1.6; stroke-dasharray: 4 3; fill: none; }

.sensor .leader { fill: none; stroke: var(--signal); stroke-width: 1; pointer-events: none; }
.sensor .bubble { fill: var(--surface); stroke: var(--signal); stroke-width: 1.6; }
.diagram .sensor .tag, .diagram .controller .tag { font-size: 8px; font-weight: 600; fill: var(--signal); stroke: none; }
.sensor.attacked .bubble { fill: var(--alarm-soft); stroke: var(--alarm); }
.diagram .sensor.attacked .tag, .diagram .sensor.attacked .value { fill: var(--alarm); }
.controller .signal { fill: none; stroke: var(--signal); stroke-width: 1.3; stroke-dasharray: 5 4; }
.controller .badge { fill: var(--signal-soft); stroke: var(--signal); stroke-width: 1.2; }
.controller.disabled { opacity: 0.45; }
.controller.attacked .badge { fill: var(--alarm-soft); stroke: var(--alarm); }
.controller.attacked .signal { stroke: var(--alarm); }
.diagram .controller.attacked .tag { fill: var(--alarm); }
.diagram .overlay { pointer-events: none; }
.rubber { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 4; }
.rubber-head { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

/* ---------------------------------------------------------------- dock */

.transport { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.transport .buttons { display: flex; gap: 4px; }
.readout { font: 500 13px var(--font-mono); color: var(--ink-2); min-width: 15ch; font-variant-numeric: tabular-nums; }
.readout b { color: var(--ink); font-size: 15px; }
.timeline { flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.timeline input[type="range"] { width: 100%; margin: 0; accent-color: var(--accent); }
.lanes { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; }
.lane { position: relative; height: 9px; }
.lane span { position: absolute; right: 100%; margin-right: 4px; top: -3px; font-size: 9px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); display: none; }
.lane i { position: absolute; top: 2px; height: 5px; border-radius: 2px; }
.lane.data_poisoning i { background: var(--cyber); }
.lane.physical_damage i { background: var(--physical); }
.lane.chemical_interference i { background: var(--chemical); }
.speed { display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13px; }

.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; max-height: 232px; overflow-y: auto; }
.chart-card { min-width: 0; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px 2px; background: var(--surface); }
.chart-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.chart-head .unit { font: 600 11px var(--font-mono); color: var(--ink-3); }
.legend { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12px; color: var(--ink-2); }
.legend .key { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.swatch { flex: none; display: inline-block; vertical-align: middle; }
.swatch line { fill: none; }
.legend b { font: 500 12px var(--font-mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.x { border: 0; background: none; color: var(--ink-3); cursor: pointer; padding: 0 3px; font-size: 15px; line-height: 1; border-radius: 3px; }
.x:hover:not(:disabled) { color: var(--ink); background: var(--surface-2); }
.x:disabled { opacity: 0.3; cursor: default; }
.plot { position: relative; }
.chart { display: block; width: 100%; height: auto; cursor: crosshair; touch-action: pan-y; }
.chart .band { fill: var(--alarm); opacity: 0.12; }
.chart .gridline { stroke: var(--line); stroke-width: 1; }
.chart .axis, .chart .axis-tick { stroke: var(--ink-3); stroke-width: 1; }
.chart .tick { font: 10px var(--font-mono); fill: var(--ink-3); }
.chart .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .line.dashed { stroke-width: 1.8; stroke-dasharray: 5 4; stroke-linecap: butt; }
.chart .dot.ring { fill: none; stroke-width: 1.8; }
.chart .cursor-line { stroke: var(--ink); stroke-width: 1; }
.chart .hover-line { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 2 3; }
.chart .dot { stroke: var(--surface); stroke-width: 2; }
.chart-tip {
  position: absolute; top: 4px; z-index: 5; pointer-events: none; display: grid; gap: 1px; min-width: 150px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 5px 8px; font-size: 12px; box-shadow: var(--shadow);
}
.chart-tip b { font: 600 12px var(--font-mono); }
.chart-tip span { display: flex; align-items: center; gap: 5px; color: var(--ink-2); white-space: nowrap; }
.chart-tip em { font: 500 12px var(--font-mono); font-style: normal; color: var(--ink); margin-left: auto; padding-left: 8px; }
.empty { color: var(--ink-3); margin: 6px 0; font-size: 13px; }

/* ---------------------------------------------------------------- side panel */

.tabs { display: flex; border-bottom: 1px solid var(--line); padding-right: max(8px, env(safe-area-inset-right, 0px)); padding-left: 8px; gap: 2px; overflow-x: auto; flex: none; }
.tab {
  border: 0; background: none; padding: 10px 9px 8px; cursor: pointer; color: var(--ink-2); font: 500 13px var(--font-display); letter-spacing: 0.02em;
  border-bottom: 2px solid transparent; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px;
}
.tab:hover { color: var(--ink); }
.tab.active { color: var(--ink); border-bottom-color: var(--accent); }
.count { font: 600 10px var(--font-mono); background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 0 5px; }
.count.error { background: var(--alarm); border-color: var(--alarm); color: #ffffff; }
.panel-body {
  flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px;
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) 24px 16px;
}
.head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 8px; align-items: end; }
.head .title { display: grid; gap: 1px; min-width: 0; }
.eyebrow { font: 600 11px var(--font-display); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); }
.id-input { font: 600 18px var(--font-display) !important; border-color: transparent !important; padding: 1px 4px !important; margin-left: -5px; width: 100%; background: none !important; }
.id-input:hover, .id-input:focus { border-color: var(--line) !important; background: var(--surface) !important; }
.head .sub { grid-column: 1 / -1; margin: 2px 0 0; color: var(--ink-2); font-size: 13px; }
.lede { margin: 0; color: var(--ink-2); font-size: 13px; }
.description { width: 100%; resize: vertical; font-size: 13px; color: var(--ink-2); }
.group { display: grid; gap: 8px; }
.group h3, details.group > summary { margin: 0; font: 600 12px var(--font-display); text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-2); }
details.group > summary { cursor: pointer; padding: 2px 0; }
.group h4 { margin: 4px 0 0; font: 600 13px var(--font); }
.row { display: flex; gap: 6px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.row select { flex: 1; min-width: 0; }

.direction { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; align-items: center; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--surface-2); }
.direction .ends { display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--ink-2); }
.direction .ends span { display: grid; min-width: 0; }
.direction small { font-size: 11px; color: var(--ink-3); }
.direction .help { grid-column: 1 / -1; }
.link-btn { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font: 600 13px var(--font-mono); text-align: left; }
.link-btn:hover { text-decoration: underline; }

.live { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.live-cell { display: grid; grid-template-columns: minmax(0, 1fr) auto; background: var(--surface); padding: 5px 6px 5px 8px; }
.live-cell:last-child:nth-child(odd) { grid-column: 1 / -1; }
.live-cell span { grid-column: 1 / -1; font-size: 11px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.live-cell b { font: 500 14px var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plot-toggle { border: 1px solid transparent; background: none; border-radius: 4px; color: var(--ink-3); cursor: pointer; padding: 1px 3px; display: inline-grid; place-items: center; }
.plot-toggle:hover { color: var(--ink); border-color: var(--line); }
.plot-toggle.on { color: var(--on-accent); background: var(--accent); }

.form { display: grid; gap: 7px; }
.field { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 2px 8px; align-items: center; }
.field > label { font-size: 13px; color: var(--ink-2); }
.field .control { display: flex; align-items: center; gap: 5px; min-width: 0; }
.field .control input, .field .control select { width: 100%; min-width: 0; }
.field input[type="number"] { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.field .unit { font: 500 11px var(--font-mono); color: var(--ink-3); white-space: nowrap; min-width: 3ch; }
.field.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.field.check input { margin-top: 3px; }
.help { grid-column: 1 / -1; margin: 0; font-size: 12px; color: var(--ink-3); }
.field.events { grid-template-columns: 1fr; gap: 5px; }
.event-row { display: flex; align-items: center; gap: 5px; }
.event-row input { width: 68px; min-width: 0; padding: 4px 6px; }
.event-row .prefix { font-size: 12px; color: var(--ink-3); }
.event-row .unit { min-width: 0; }

.pump-curve { width: 100%; height: auto; display: block; }
.pump-curve .axis { stroke: var(--ink-3); stroke-width: 1; }
.pump-curve .tick { font: 10px var(--font-mono); fill: var(--ink-3); }
.pump-curve .curve { fill: none; stroke: var(--ink); stroke-width: 2; }
.pump-curve .curve.now { stroke: var(--water); stroke-dasharray: 4 3; }
.pump-curve .bep { stroke: var(--ink-3); stroke-dasharray: 2 3; }
.pump-curve .point { fill: var(--water); stroke: var(--surface); stroke-width: 2; }

.list, .cards, .issues, .events, .counts, .tips { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 13px; }
.list li { color: var(--ink-2); }
.tips { gap: 7px; color: var(--ink-2); }
.tips li { padding-left: 12px; position: relative; }
.tips li::before { content: ""; position: absolute; left: 0; top: 0.62em; width: 5px; height: 1.5px; background: var(--ink-3); }
.counts { grid-template-columns: repeat(3, minmax(0, 1fr)); color: var(--ink-2); }
.counts b { font: 600 15px var(--font-mono); color: var(--ink); }
.cards { gap: 6px; }
.cards li { display: flex; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); overflow: hidden; }
.cards li.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.card-btn { flex: 1; min-width: 0; text-align: left; border: 0; background: none; cursor: pointer; padding: 7px 10px; display: grid; gap: 2px; position: relative; }
.card-btn:hover { background: var(--surface-2); }
.card-btn b { font: 600 13px var(--font-mono); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.card-btn em { font: 500 11px var(--font-display); font-style: normal; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); }
.card-btn em.off { color: var(--warn); }
.card-btn span { color: var(--ink-2); font-size: 13px; }
.card-btn small { color: var(--ink-3); font-size: 12px; }
.order { display: grid; align-content: center; border-left: 1px solid var(--line); padding: 0 2px; }
.attacks li.data_poisoning em.class { color: var(--cyber); }
.attacks li.physical_damage em.class { color: var(--physical); }
.attacks li.chemical_interference em.class { color: var(--chemical); }
.attacks li.active { border-color: var(--alarm); box-shadow: 0 0 0 1px var(--alarm); }
.when { display: block; position: relative; height: 4px; background: var(--surface-2); border-radius: 2px; margin-top: 3px; }
.when i { position: absolute; top: 0; height: 4px; border-radius: 2px; background: var(--ink-3); }
.attacks li.data_poisoning .when i { background: var(--cyber); }
.attacks li.physical_damage .when i { background: var(--physical); }
.attacks li.chemical_interference .when i { background: var(--chemical); }
.add-group { display: grid; gap: 4px; padding-top: 4px; }
.issues li { padding: 6px 9px; border-radius: 5px; }
.issues.error li { background: var(--alarm-soft); color: var(--alarm); }
.issues.warning li { background: var(--warn-soft); color: var(--warn); }
.error-text { color: var(--alarm); margin: 0; font-size: 13px; }
.facts { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 10px; margin: 0; font-size: 13px; }
.facts dt { color: var(--ink-2); }
.facts dd { margin: 0; font: 500 13px var(--font-mono); text-align: right; font-variant-numeric: tabular-nums; }
.events { max-height: 260px; overflow-y: auto; }
.events li { color: var(--ink-2); }
.events li.attack { color: var(--alarm); }
.events .time { font-weight: 500; color: var(--ink-3); }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
table { border-collapse: collapse; font: 11px var(--font-mono); font-variant-numeric: tabular-nums; }
th, td { padding: 3px 7px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { background: var(--surface-2); color: var(--ink-2); font-weight: 600; }
tbody tr:last-child td { border-bottom: 0; }

/* ---------------------------------------------------------------- narrow screens */

@media (max-width: 900px) {
  html, body { height: auto; }
  #app { display: flex; flex-direction: column; height: auto; }
  .rail { flex-direction: row; border-right: 0; border-bottom: 1px solid var(--line); padding: 6px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); overflow-x: auto; }
  .rail { gap: 2px; }
  .tool { flex: 1 1 0; min-width: 44px; width: auto; padding-left: 0; padding-right: 0; font-size: 10px; }
  .stage { height: 58vh; min-height: 340px; }
  .dock { padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .side { border-left: 0; border-top: 1px solid var(--line); }
  .tabs { padding-left: max(8px, env(safe-area-inset-left, 0px)); }
  .panel-body { overflow: visible; padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  .charts { max-height: none; grid-template-columns: minmax(0, 1fr); }
  .view-options label[for="color-by"] { display: none; }
  .diagram-hint { max-width: calc(100% - 24px); top: 52px; }
  .field { grid-template-columns: minmax(0, 1fr) 130px; }
}

@media (prefers-reduced-motion: reduce) {
  .link.flowing .flow { animation: none; }
}

var TOOLS = [
  ["select", "Select", "Select and move things (Esc)"],
  ["junction", "Junction", "Add a junction: a point where pipes meet or water is used"],
  ["tank", "Tank", "Add a storage tank"],
  ["reservoir", "Reservoir", "Add a reservoir: a source at a fixed level, such as a well field or lake"],
  ["pipe", "Pipe", "Draw a pipe between two nodes"],
  ["pump", "Pump", "Draw a pump from its suction node to its discharge node"],
  ["valve", "Valve", "Draw a valve from its inlet node to its outlet node"]
];
var COLOR_BY = [
  ["none", "Plain"],
  ["pressure", "Pressure"],
  ["velocity", "Pipe velocity"],
  ["chlorine", "Chlorine"],
  ["ph", "pH"],
  ["tracer", "Tracer"],
  ["age", "Water age"],
  ["temperature", "Temperature"],
  ["oxygen", "Dissolved oxygen"],
  ["ammonia", "Ammonia"]

function build2(app) {
  const status = h("button", { class: "status", id: "status", title: "Open the Run tab", onclick: () => {
    state.panel = "run";
    emit("panel");
  } });
  const runButton = h("button", { class: "btn primary", id: "run", onclick: runNow }, "Run");
  const undoButton = h("button", { class: "btn", id: "undo", title: "Undo (Ctrl+Z)", onclick: undo }, "Undo");
  const redoButton = h("button", { class: "btn", id: "redo", title: "Redo (Ctrl+Shift+Z)", onclick: redo }, "Redo");
  const exampleSelect = h("select", {
    id: "example",
    "aria-label": "Open an example",
    onchange: async (event) => {
      const file = event.target.value;
      if (!file) return;
      try {
        openScenario(await loadExample(file));
      } catch (error) {
        toast(error.message);
      }
    }
  }, h("option", { value: "" }, "Examples\u2026"), EXAMPLES.map((example) => h("option", { value: example.file }, example.title)));
  const topbar = h(
    "header",
    { class: "topbar" },
    h("div", { class: "brand" }, h("strong", null, "ACWAverse"), h("span", { id: "scenario-name" })),
    h("div", { class: "bar-group" }, exampleSelect, undoButton, redoButton),
    h(
      "div",
      { class: "bar-group view-options" },
      h("label", { for: "color-by" }, "Colour by"),
      h("select", { id: "color-by", onchange: (event) => {
        state.colorBy = event.target.value;
        emit("view");
      } }, COLOR_BY.map(([value, label]) => h("option", { value }, label))),
      h("label", { class: "toggle", for: "show-control" }, h("input", { id: "show-control", type: "checkbox", checked: state.showControl, onchange: (event) => {
        state.showControl = event.target.checked;
        emit("selection");
      } }), "Control layer"),
      h("label", { class: "toggle", for: "show-values" }, h("input", { id: "show-values", type: "checkbox", checked: state.showValues, onchange: (event) => {
        state.showValues = event.target.checked;
        emit("view");
      } }), "Values")
    ),
    h("div", { class: "bar-group end" }, status, runButton)

  const rail = h("nav", { class: "rail", "aria-label": "Drawing tools" }, TOOLS.map(([tool, label, title]) => h("button", {
    class: "tool",
    "data-tool": tool,
    title,
    "aria-pressed": "false",
    onclick: () => {
      state.tool = tool;
      emit("tool");
    }
  }, toolIcon(tool), h("span", null, label))));
  const stage = h("main", { class: "stage" });
  const zoomBox = h(
    "div",
    { class: "zoom" },
    h("button", { class: "btn icon-btn", title: "Zoom in", "aria-label": "Zoom in", onclick: () => zoom(1.25) }, "+"),
    h("button", { class: "btn icon-btn", title: "Zoom out", "aria-label": "Zoom out", onclick: () => zoom(0.8) }, "\u2212"),
    h("button", { class: "btn", title: "Show the whole system", onclick: fit }, "Fit")
  );
  const side = h("aside", { class: "side", "aria-label": "Details" });
  const dock = h("section", { class: "dock", "aria-label": "Time and trends" });
  app.append(topbar, rail, stage, dock, side, h("div", { id: "toast", class: "toast", role: "status", hidden: true }));
  mountDiagram(stage);
  stage.append(zoomBox);
  const dockApi = mountDock(dock);
  mountPanels(side);
  const refresh = () => {
    const errors = state.issues.filter((issue) => issue.level === "error").length;
    document.getElementById("scenario-name").textContent = state.scenario.name || "";
    undoButton.disabled = !canUndo();
    redoButton.disabled = !canRedo();
    runButton.hidden = state.autoRun && errors === 0;
    runButton.disabled = errors > 0;
    let text;
    let kind = "ok";
    if (errors > 0) {
      text = `${errors} ${errors === 1 ? "problem" : "problems"} to fix`;
      kind = "bad";
    } else if (state.runError) {
      text = "The run stopped";
      kind = "bad";
    } else if (state.pending) {
      text = "Running\u2026";
      kind = "busy";
    } else if (state.stale || !state.results) {
      text = "Changed since the last run";
      kind = "busy";
    } else {
      const events = state.results.events.filter((event) => event.kind !== "attack" && event.kind !== "solver").length;
      text = `Up to date \xB7 ${num2(state.runMs)} ms${events > 0 ? ` \xB7 ${events} ${events === 1 ? "event" : "events"}` : ""}`;
    }
    status.textContent = text;
    status.dataset.kind = kind;
  };
  on("scenario", () => {
    if (state.pending) scheduleRun();
    refresh();
  });
  on("results loaded", refresh);
  on("tool", () => rail.querySelectorAll(".tool").forEach((button) => {
    const active = button.dataset.tool === state.tool;
    button.classList.toggle("active", active);
    button.setAttribute("aria-pressed", active ? "true" : "false");
  }));
  emit("tool");
  window.addEventListener("keydown", (event) => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName);
    const mod = event.ctrlKey || event.metaKey;
    if (mod && event.key.toLowerCase() === "z") {
      event.preventDefault();
      if (event.shiftKey) redo();
      else undo();
      return;
    }
    if (mod && event.key.toLowerCase() === "y") {
      event.preventDefault();
      redo();
      return;
    }
    if (typing) return;
    if (event.key === "Escape") {
      if (!cancelPending()) {
        if (state.tool !== "select") {
          state.tool = "select";
          emit("tool");
        } else select(null);
      }
    } else if ((event.key === "Delete" || event.key === "Backspace") && state.selection) {
      event.preventDefault();
      const { kind, id } = state.selection;
      deleteElement(kind, id);
    } else if (event.key === " ") {
      event.preventDefault();
      dockApi.setPlaying(!state.playing);
    } else if (event.key === "ArrowRight") {
      setRow(state.row + 1);
    } else if (event.key === "ArrowLeft") {
      setRow(state.row - 1);
    }
  });
}
function openScenario(scenario) {
  freshlyLoaded = true;
  state.autoRun = true;
  load(scenario);
}
async function start() {
  const app = document.getElementById("app");
  state.scenario = blankScenario();
  build2(app);
  try {
    openScenario(await loadExample(EXAMPLES[0].file));
  } catch (error) {
    openScenario(blankScenario());
    toast(error.message);
  }
}
start();
